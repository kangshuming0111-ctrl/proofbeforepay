<!doctype html><html lang="en"><head><title>Fictional independent venue</title></head><body>
<form id="intake" aria-label="Reserve a visit">
<label for="headcount">Guests attending</label><input id="headcount" type="number">
<label for="service-window">Start time</label><select id="service-window"><option value="2099-01-01T10:00:00Z">10:00</option></select>
<label for="entry-mode">Creation test instruction</label><select id="entry-mode"><option value="cancel-create">cancel-create</option><option value="cancel-five">cancel-five</option><option value="cancel-three">cancel-three</option><option value="cancel-extra">cancel-extra</option><option value="source-create">source-create</option><option value="loss-create">loss-create</option></select><button id="send-entry">Continue</button></form>
<form id="withdrawal" aria-label="Cancel reservation"><label for="cancel-ticket">Reservation reference</label><select id="cancel-ticket"><option value="private-customer-id">PRIVATE-CUSTOMER-CANARY</option></select><label for="withdraw-mode">Cancellation instruction</label><select id="withdraw-mode"><option value="cancel-first">cancel-first</option><option value="cancel-repeat">cancel-repeat</option></select><button id="send-withdrawal">Continue</button></form>
<form id="amend" aria-label="Reschedule reservation"><label for="change-ticket">Saved reservation reference</label><select id="change-ticket"></select><label for="another-window">New start time</label><select id="another-window"><option value="2099-01-01T11:00:00Z">11:00</option></select><label for="amend-mode">Move test instruction</label><select id="amend-mode"><option value="move-full">move-full</option><option value="move-free">move-free</option></select><button id="send-amend">Continue</button></form>
<button id="redo-native" type="button">Retry original operation</button><div id="receipt-state" role="status">PRIVATE-RESULT-CANARY</div></body></html>
